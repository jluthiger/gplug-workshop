# Tag v<VERSION> pushen -> spot.tapp und spot-sim.tapp als GitHub-Release veröffentlichen.
name: Release tapp

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag muss zu VERSION passen
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"

      - name: tapp bauen
        run: tools/build_tapp.sh dist

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > dist/notes.md <<'NOTES'
          Referenz-App als Tasmota-App für den gPlug (Tasmota >= 15.3.0, ESP32-C3).

          **Nur eine Datei installieren:**

          - `spot.tapp` – am Smart Meter (`"sim": false`)
          - `spot-sim.tapp` – ohne Smart Meter, Simulator mit Fake-Daten (`"sim": true`)

          **Installation:**

          1. Liegen `/autoexec.be` oder `/spot.be` vom Workshop auf dem Gerät: entfernen, sonst
             lädt die App doppelt und überschreibt die tapp-Fassung.
          2. Datei in der WebUI unter *Werkzeuge → Dateisystem verwalten* hochladen, Dateiname
             unverändert.
          3. Gerät neu starten (`Restart 1`), in der Konsole `SpotStatus` prüfen.
          4. Sommerzeit: einmalig `Timezone 99` setzen.

          **Update:** neue Datei hochladen (ersetzt die alte), neu starten.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/spot.tapp dist/spot-sim.tapp \
            --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
